<!doctype html>
<html><head><meta charset="utf-8"><title>Paper Trade</title>
<style>
:root{--bg:#07090d;--p:#10141c;--b:#232a38;--t:#e8e8ea;--m:#8a91a3;--g:#2fd6a0;--r:#ff5468;--y:#ffb020;--a:#6c7bff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1000px 400px at 0 -10%,#1a1440 0,transparent 60%),var(--bg);color:var(--t);font:13px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
.banner{background:repeating-linear-gradient(45deg,#3a2a00,#3a2a00 10px,#2a1f00 10px,#2a1f00 20px);color:var(--y);text-align:center;font-weight:800;letter-spacing:2px;padding:3px;font-size:11px}
header{display:flex;gap:18px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--b);flex-wrap:wrap}
header .n{font-size:16px;font-weight:700}header .mc{font-size:20px;font-weight:800}
.s{display:flex;flex-direction:column}.s span:first-child{color:var(--m);font-size:11px}
.up{color:var(--g)}.dn{color:var(--r)}
main{flex:1;display:grid;grid-template-columns:1fr 330px;min-height:0}
.left{display:flex;flex-direction:column;min-height:0}
#chart{flex:1;border:0;width:100%;min-height:300px;background:#000}
.tabs{display:flex;gap:4px;border-top:1px solid var(--b);padding:4px 8px}
.tabs button{background:none;border:0;color:var(--m);padding:6px 10px;cursor:pointer;font-weight:600}.tabs button.on{color:var(--t);border-bottom:2px solid var(--a)}
.pane{height:200px;overflow:auto;padding:0 8px}table{width:100%;border-collapse:collapse}td,th{padding:5px 6px;border-bottom:1px solid #1b2030;text-align:left;font-size:12px}th{color:var(--m);font-weight:600}
aside{border-left:1px solid var(--b);padding:10px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.box{background:linear-gradient(180deg,var(--p),#0c1017);border:1px solid var(--b);border-radius:14px;padding:10px}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:4px}.bs button{padding:9px;border-radius:8px;border:0;font-weight:700;cursor:pointer;background:#1b2030;color:var(--m)}
.bs .buy.on{background:var(--g);color:#002}.bs .sell.on{background:var(--r);color:#fff}
.amt{display:flex;align-items:center;background:#0e1118;border:1px solid var(--b);border-radius:8px;padding:6px 8px;margin:8px 0}.amt input{flex:1;background:none;border:0;color:var(--t);font-size:15px;outline:none}
.q{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.q button{background:#1b2030;border:1px solid var(--b);color:var(--t);border-radius:6px;padding:6px;cursor:pointer}
.go{width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
.go.b{background:linear-gradient(135deg,#2fe0a5,#16b585);color:#032;box-shadow:0 0 18px #2fe0a533}.go.s{background:linear-gradient(135deg,#ff4d6a,#d92f4c);color:#fff;box-shadow:0 0 18px #ff4d6a33}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}.g4 div span{display:block;color:var(--m);font-size:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.g3 div{background:#0e1118;border:1px solid var(--b);border-radius:8px;padding:6px;text-align:center}.g3 span{display:block;color:var(--m);font-size:10px}
.muted{color:var(--m);font-size:11px}.row{display:flex;justify-content:space-between;align-items:center}
a{color:#8ab4ff}.lnk{font-size:12px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1b2130;border:1px solid var(--y);padding:8px 14px;border-radius:8px;display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 0}.cal div{background:#0e1118;border:1px solid var(--b);border-radius:6px;min-height:34px;padding:3px 5px;font-size:11px}.cal .h{background:none;border:0;color:var(--m);text-align:center;min-height:0}.cal .w{background:#0f2a22;border-color:#1e6b54}.cal .l{background:#2c1218;border-color:#7a2433}.cal b{display:block;font-size:12px}
.wbtn{flex:1;background:#1b2030;border:1px solid var(--b);color:var(--t);border-radius:6px;padding:5px;cursor:pointer;font-size:12px}.wbtn:disabled{opacity:.4;cursor:default}
.empty{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:8px}
</style></head><body>
<header id="hdr"><span class="muted">Loading…</span></header>
<main>
 <div class="left">
  <iframe id="chart"></iframe>
  <div class="tabs"><button data-p="live" class="on">Live Trades</button><button data-p="pos">Positions</button><button data-p="hist">Trades</button><button data-p="hold">Holders</button><button data-p="port">Portfolio</button><button data-p="cal">PnL Calendar</button><button data-p="about">About</button></div>
  <div class="pane" id="pane"></div>
 </div>
 <aside>
  <div class="box">
   <div class="row"><b>Paper Wallet</b><span><b id="bal">0</b> <a href="#" id="reset" class="muted">reset</a></span></div>
   <div class="row" style="margin-top:6px;gap:6px"><button id="wCopy" class="wbtn" title="Copy your whole paper wallet (balance, positions, every trade) as one code — paste it into Load wallet on your phone or another PC">📋 Copy wallet</button><button id="wLoad" class="wbtn" title="Paste a wallet code from Copy wallet. Shows a preview first; your current wallet is only replaced after you confirm">📥 Load wallet</button></div>
   <div id="wPanel" style="display:none;margin-top:6px"><textarea id="wCode" rows="3" placeholder="Paste wallet code (starts with PTW1.)" style="width:100%;box-sizing:border-box;background:#0e1118;color:#fff;border:1px solid #333;border-radius:6px;font-size:11px"></textarea><div id="wPrev" class="muted" style="margin:4px 0"></div><div class="row" style="gap:6px"><button id="wOk" class="wbtn" disabled>Replace my wallet with this</button><button id="wNo" class="wbtn">Cancel</button></div></div>
  </div>
  <div class="box">
   <div class="bs"><button class="buy on" id="tBuy">Buy</button><button class="sell" id="tSell">Sell</button></div>
   <div class="amt"><input id="amt" type="number" step="0.01" min="0" placeholder="0.0"><span id="unit">PAPER SOL</span></div>
   <div class="q" id="quick"></div>
   <div class="muted" style="margin-top:6px">Sim: <span id="slipTxt"></span> slippage · 1% fee · fills at the price shown</div>
   <div id="staleW" class="dn" style="display:none;font-size:11px;margin-top:6px;font-weight:700"></div><button class="go b" id="go">Paper Buy</button>
  </div>
  <div class="box">
   <div class="g4"><div><span>Bought</span><b id="pB">0</b></div><div><span>Sold</span><b id="pS">0</b></div><div><span>Holding</span><b id="pH">0</b></div><div><span>PnL</span><b id="pP">0</b></div></div>
   <div class="muted" style="text-align:center;margin-top:4px">values in SOL</div>
   <div class="g3" id="pstats" style="margin-top:8px"></div>
   <div class="row" style="margin-top:6px"><span class="muted">Show entry/now as</span><a href="#" id="unitTog" class="muted">market cap ⇄ price</a></div>
  </div>
  <div class="box"><b>Token Info</b><div class="g3" id="sec" style="margin-top:8px"></div></div>
  <div class="box lnk" id="links"></div>
  <div class="box"><b>Live feed</b> <span id="feedSt" class="muted">off</span><div class="muted" style="margin:4px 0">Paste your free Helius API key to turn on live trades.</div><div style="display:flex;gap:6px"><input id="hk" placeholder="Paste Helius API key (xxxxxxxx-xxxx-…)" style="flex:1;min-width:0;padding:6px;background:#0e1118;color:#fff;border:1px solid #333;border-radius:6px;filter:blur(5px)"><button id="hkEye" title="Show / hide key" style="padding:0 8px;background:#0e1118;color:#fff;border:1px solid #333;border-radius:6px;cursor:pointer">👁</button></div></div>
 </aside>
</main>
<div id="toast"></div>
<script>
// ================= Paper Trade (session 9) =================
// Price: live on-chain via ONE Helius websocket per window (pool account / vaults + trade logs). DexScreener = slow fallback + stats.
// Wallet: shared localStorage 'papertrade_v1', re-read before every change, synced across windows via the 'storage' event.
const $=s=>document.querySelector(s), ca=new URLSearchParams(location.search).get('ca');
const K='papertrade_v1', START=10, FEE=0.01, SLIP=0.02, HK='papertrade_helius', WSM='So11111111111111111111111111111111111111112';
const fmt=(n,d=2)=>n==null||isNaN(n)?'-':Math.abs(n)>=1e9?(n/1e9).toFixed(2)+'B':Math.abs(n)>=1e6?(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e3?(n/1e3).toFixed(1)+'K':(+n).toFixed(d);
const usd=n=>n==null||isNaN(n)?'-':'$'+fmt(n);
const pxs=n=>!n?'-':n<0.01?n.toExponential(3):n.toFixed(4);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',2500)};
const f=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$('#slipTxt').textContent=(SLIP*100)+'%';

// ---------- wallet state: shared by all windows (#8) ----------
const fresh0=()=>({bal:START,pos:{},hist:[]});
function load(){try{const v=JSON.parse(localStorage.getItem(K));if(v&&typeof v.bal==='number')return v}catch(e){}return fresh0()}
let st=load();
// Every change re-reads storage first, so another window's trades are never overwritten.
function mutate(fn){st=load();const r=fn(st);try{localStorage.setItem(K,JSON.stringify(st))}catch(e){toast('Could not save: '+e.message)}sched(true);return r}
window.addEventListener('storage',e=>{if(e.key===K){st=load();try{pickPrice();drawNums();drawPane(true)}catch(x){}}if(e.key==='pt_unit'){unit=localStorage.getItem('pt_unit')||'mc';sched(true)}});

// ---------- display unit toggle (#12) ----------
let unit=(()=>{try{return localStorage.getItem('pt_unit')||'mc'}catch(e){return 'mc'}})();
$('#unitTog').onclick=e=>{e.preventDefault();unit=unit==='mc'?'price':'mc';try{localStorage.setItem('pt_unit',unit)}catch(x){}sched(true)};
// show a value captured as {mc, px(usd)} in the chosen unit
const showMP=(mc,pu)=>unit==='mc'?usd(mc):(pu?'$'+pxs(pu):'-');

// ---------- market data ----------
let side='buy', pair=null, rc=null, tab='live', solUsd=0, supply=0;
let dsSol=0, dsUsd=0;           // DexScreener price (slow)
let live={p:0,at:0,src:'',ok:false}; // live on-chain price (SOL per token)
let priceSol=0, priceUsd=0;      // price actually used (live if live, else DexScreener)
const isLive=()=>live.ok&&live.p>0&&sock&&sock.readyState===1;
const curMC=()=>priceUsd&&supply?priceUsd*supply:null;

if(!ca){const o=document.createElement('div');o.className='empty';o.style.cssText='position:fixed;inset:24px 0 0 0;background:var(--bg);z-index:5';o.innerHTML='<h2>No coin selected</h2><div class="muted">Open this from Quick Scan → Paper Trade, or paste a CA:</div><input id="ci" style="width:420px;padding:8px;background:#0e1118;color:#fff;border:1px solid #333;border-radius:8px"><button class="go b" style="width:200px" id="ciGo">Open</button>';document.body.appendChild(o);$('#ciGo').onclick=()=>{const v=$('#ci').value.trim();if(v)location.search='?ca='+v};$('#hdr').innerHTML='<b>Paper Trade</b>';}
else init();

async function init(){
 await refresh(true);
 if(!pair)return;
 $('#chart').src='https://dexscreener.com/solana/'+pair.pairAddress+'?embed=1&theme=dark&info=0&trades=0';
 $('#links').innerHTML=`<a target=_blank href="https://v2.bubblemaps.io/map?address=${ca}&chain=solana">Bubblemaps</a> · <a target=_blank href="https://rugcheck.xyz/tokens/${ca}">RugCheck</a> · <a target=_blank href="https://solscan.io/token/${ca}">Solscan</a> · <a target=_blank href="https://gmgn.ai/sol/token/${ca}">GMGN</a>`;
 loadRC();connect();setInterval(refresh,3000);setInterval(loadRC,60000);setInterval(trackHiLo,1000);
}

// Header is built ONCE; refresh() only updates DexScreener stats, never the live price (#5)
function buildHeader(){const q=(pair.quoteToken||{}).symbol||'';
 $('#hdr').innerHTML=`<span class="n">${pair.baseToken.symbol} <span class="muted">${pair.baseToken.name}</span></span><span class="mc" id="hMc">-</span>
 <div class="s"><span>Price</span><b id="pxv">-</b><span id="pxs" class="muted" style="font-size:10px">starting…</span></div><div class="s"><span>Liquidity</span><b id="hLiq">-</b></div>
 <div class="s"><span>Vol 24h</span><b id="hVol">-</b></div><div class="s"><span>5m</span><b id="h5">-</b></div><div class="s"><span>1h</span><b id="h1">-</b></div><div class="s"><span>24h</span><b id="h24">-</b></div>
 <div class="s"><span>Pair</span><b>${pair.baseToken.symbol}/${q} · ${pair.dexId}</b></div><div class="s"><span>Txns 5m</span><b id="hTx">-</b></div>`}
async function refresh(first){
 const [d0,d1]=await Promise.all([f('https://api.dexscreener.com/token-pairs/v1/solana/'+ca),f('https://api.dexscreener.com/tokens/v1/solana/'+ca)]);
 const _s=new Set(),d=[...(d0||[]),...(d1||[])].filter(x=>x&&x.pairAddress&&!_s.has(x.pairAddress)&&_s.add(x.pairAddress));
 if(!d.length){if(first)$('#hdr').innerHTML='<span class="dn">No live pair found for this CA.</span>';return}
 if(!pair){pair=d.sort((a,b)=>((b.liquidity||{}).usd||0)-((a.liquidity||{}).usd||0))[0];buildHeader()} // pair is LOCKED once chosen (#10)
 else{const same=d.find(x=>x.pairAddress===pair.pairAddress);if(same)pair=same}
 const pu=+pair.priceUsd||0,pn=+pair.priceNative||0,q=(pair.quoteToken||{}).symbol||'';
 if(q==='SOL'||q==='WSOL'){if(pn)solUsd=pu/pn;dsSol=pn}
 else{if(!solUsd){const s=await f('https://api.dexscreener.com/tokens/v1/solana/'+WSM);const sp=(s||[]).find(p=>p.quoteToken&&/USD/.test(p.quoteToken.symbol));solUsd=sp?+sp.priceUsd:0}dsSol=solUsd?pu/solUsd:0}
 dsUsd=pu;if(pu)supply=(pair.marketCap||pair.fdv||0)/pu;
 const ch=pair.priceChange||{},c=(id,v)=>{const e=document.getElementById(id);if(e){e.className=(v||0)>=0?'up':'dn';e.textContent=((v||0)>=0?'+':'')+(v??0)+'%'}};
 const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
 set('hLiq',usd((pair.liquidity||{}).usd));set('hVol',usd((pair.volume||{}).h24));c('h5',ch.m5);c('h1',ch.h1);c('h24',ch.h24);
 const t5=(pair.txns&&pair.txns.m5)||{};const tx=document.getElementById('hTx');if(tx)tx.innerHTML=`<span class="up">${t5.buys||0}</span>/<span class="dn">${t5.sells||0}</span>`;
 pickPrice();sched(false);
}
// choose the price in use: live when the websocket is up and calibrated, else DexScreener (flagged stale)
function pickPrice(){
 if(isLive()){priceSol=live.p;priceUsd=solUsd?live.p*solUsd:(dsSol?dsUsd*live.p/dsSol:0)}
 else{priceSol=dsSol;priceUsd=dsUsd}
}
async function loadRC(){const r=await f('https://api.rugcheck.xyz/v1/tokens/'+ca+'/report');if(r)rc=r;drawSec();if(tab==='hold')drawPane(true);if(!sock)connect()}
function realHolders(){if(!rc)return[];const _ka=rc.knownAccounts||{},_pool=new Set();(rc.markets||[]).forEach(x=>[x.liquidityA,x.liquidityB,x.pubkey,x.liquidityAAccount,x.liquidityBAccount].forEach(a=>a&&_pool.add(a)));return (rc.topHolders||[]).filter(h=>!(_pool.has(h.address)||_pool.has(h.owner)||/AMM/i.test(((_ka[h.owner]||_ka[h.address]||{}).type)||'')))}
const top10=()=>realHolders().slice(0,10).reduce((s,h)=>s+(h.pct||0),0);
function drawSec(){
 if(!rc){$('#sec').innerHTML='<div class="muted" style="grid-column:1/4">RugCheck unavailable</div>';return}
 const t10=top10(),lp=(()=>{const mk=(rc.markets||[]).map(x=>x.lp||{}),tot=mk.reduce((t,l)=>t+(l.quoteUSD||0)+(l.baseUSD||0),0),lk=mk.reduce((t,l)=>t+(l.lpLockedUSD||0),0);return tot>0?lk/tot*100:Math.max(0,...mk.map(l=>l.lpLockedPct||0))})();
 const cell=(l,v,ok)=>`<div><b class="${ok?'up':'dn'}">${v}</b><span>${l}</span></div>`;
 $('#sec').innerHTML=cell('Top 10 H.',t10.toFixed(1)+'%',t10<=25)+cell('LP Locked',lp.toFixed(0)+'%',lp>=80)+cell('Insider nets',rc.graphInsidersDetected||0,(rc.graphInsidersDetected||0)<=3)
 +cell('Mint Auth',rc.mintAuthority?'ON':'No',!rc.mintAuthority)+cell('Freeze Auth',rc.freezeAuthority?'ON':'No',!rc.freezeAuthority)+cell('Holders',fmt(rc.totalHolders||0,0),(rc.totalHolders||0)>=200);
}

// ---------- trading ----------
function quick(){const q=$('#quick');q.innerHTML=(side==='buy'?['0.1','0.5','1','5']:['25%','50%','75%','100%']).map(v=>`<button>${v}</button>`).join('');
 q.querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#amt').value=b.textContent.replace('%','')})}
function setSide(s){side=s;$('#tBuy').classList.toggle('on',s==='buy');$('#tSell').classList.toggle('on',s==='sell');$('#unit').textContent=s==='buy'?'PAPER SOL':'% OF BAG';
 const g=$('#go');g.className='go '+(s==='buy'?'b':'s');g.textContent=s==='buy'?'Paper Buy':'Paper Sell';$('#amt').value='';quick();sched(false)}
$('#tBuy').onclick=()=>setSide('buy');$('#tSell').onclick=()=>setSide('sell');

// snapshot saved with every trade (#13): what you saw when you clicked
function qsCard(){try{return JSON.parse(localStorage.getItem('qs_card_'+ca)||'null')}catch(e){return null}}
function snapshot(){const q=qsCard()||{},warns=[];if(!isLive())warns.push('stale price (DexScreener)');const w=washInfo();if(w)warns.push(w.text);
 return {mc:Math.round(curMC()||0),liq:Math.round((pair.liquidity||{}).usd||0),top10:rc?+top10().toFixed(1):null,insiders:rc?(rc.graphInsidersDetected||0):null,holders:rc?(rc.totalHolders||0):null,
  rug:q.rug||'not scanned',timing:q.entry||'not scanned',tips:q.tips||'not checked',wallet:q.wallet||'not checked',scanAgeMin:q.t?Math.round((Date.now()-q.t)/60000):null,
  price_src:isLive()?'live ('+live.src+')':'stale DexScreener',warnings:warns.join(' | ')||'none'}}
$('#go').onclick=()=>{
 if(!pair)return toast('No pair loaded');if(!priceSol)return toast('No price yet');
 const raw=$('#amt').value.trim(),v=+raw;if(!raw||!isFinite(v)||v<=0)return toast('Enter an amount above 0');
 const pxNow=priceSol,mcNow=curMC(),puNow=priceUsd,snap=snapshot(),sym=pair.baseToken.symbol;
 const res=mutate(st=>{const p=st.pos[ca]||(st.pos[ca]={sym,tok:0,cost:0,in:0,out:0,mcw:0,t0:0,hi:0,lo:0});
  if(side==='buy'){if(v>st.bal+1e-12)return 'Not enough paper SOL (balance '+st.bal.toFixed(3)+')';
   const fill=pxNow*(1+SLIP),tok=v*(1-FEE)/fill;if(!p.tok){p.t0=Date.now();p.hi=pxNow;p.lo=pxNow;p.cost=0;p.mcw=0}
   st.bal-=v;p.tok+=tok;p.cost+=v;p.in+=v;p.mcw+=v*(mcNow||0);p.sym=sym;
   st.hist.unshift({t:Date.now(),ca,sym,side:'BUY',sol:v,tok,px:pxNow,pu:puNow,mc:mcNow,snap});return 'Paper bought '+fmt(tok)+' '+sym+' for '+v+' SOL'}
  if(!(p.tok>0))return 'You hold none of this coin';if(v>100)return 'Sell % must be 1–100';
  const pct=v/100,tok=p.tok*pct,fill=pxNow*(1-SLIP),sol=tok*fill*(1-FEE),basis=p.cost*pct,mcBasis=p.mcw*pct;
  p.cost-=basis;p.mcw-=mcBasis;p.tok-=tok;p.out+=sol;st.bal+=sol;if(p.tok<1e-9){p.tok=0;p.cost=0;p.mcw=0}
  st.hist.unshift({t:Date.now(),ca,sym:p.sym,side:'SELL',sol,tok,px:pxNow,pu:puNow,mc:mcNow,pnl:sol-basis,snap});return 'Paper sold '+v+'% for '+sol.toFixed(4)+' SOL'});
 toast(res)};
$('#reset').onclick=e=>{e.preventDefault();if(confirm('Reset paper wallet to '+START+' SOL and clear ALL history (every window)?')){mutate(st=>{st.bal=START;st.pos={};st.hist=[]});toast('Wallet reset')}};
// ---------- wallet copy / load (session 10): move the paper wallet between PC and phone ----------
// Code = "PTW1." + base64url(deflate(JSON)) + "." + 8-hex checksum of the JSON. Bad/changed codes are rejected before anything is touched.
const b64u=b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64u=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a};
const ck8=s=>{let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(16).padStart(8,'0')};
async function zip(str,inflate){const cs=inflate?new DecompressionStream('deflate-raw'):new CompressionStream('deflate-raw');const out=new Blob([inflate?str:new TextEncoder().encode(str)]).stream().pipeThrough(cs);return inflate?await new Response(out).text():await new Response(out).arrayBuffer()}
async function walletCode(){const j=JSON.stringify(load());return 'PTW1.'+b64u(await zip(j))+'.'+ck8(j)}
function validWallet(v){return v&&typeof v==='object'&&typeof v.bal==='number'&&isFinite(v.bal)&&v.bal>=0&&v.pos&&typeof v.pos==='object'&&!Array.isArray(v.pos)&&Array.isArray(v.hist)&&v.hist.every(h=>h&&typeof h.t==='number'&&(h.side==='BUY'||h.side==='SELL')&&typeof h.sol==='number')&&Object.values(v.pos).every(p=>p&&typeof p.tok==='number'&&isFinite(p.tok))}
