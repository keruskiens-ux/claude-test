<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Scan</title>
<style>
:root{--bg:#07090d;--p:#10141c;--p2:#151a24;--b:#232a38;--t:#e9ecf2;--m:#8891a5;--g:#2fe0a5;--r:#ff4d6a;--y:#ffbb33;--a:#7c6cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 500px at 10% -10%,#1a1440 0,transparent 60%),radial-gradient(900px 500px at 110% 0,#0d2a2a 0,transparent 55%),var(--bg);color:var(--t);font:13px Inter,system-ui,sans-serif;min-height:100vh;padding:18px 22px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}.logo{font-size:20px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#9b8cff,#2fe0a5);-webkit-background-clip:text;color:transparent}
.bar{display:flex;gap:8px;flex-wrap:wrap}.bar textarea{min-width:100%}textarea{flex:1;height:46px;resize:vertical;background:var(--p);color:var(--t);border:1px solid var(--b);border-radius:12px;padding:12px;font:13px ui-monospace,monospace;outline:none}textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px #7c6cff22}
.btn{background:linear-gradient(135deg,#7c6cff,#5a4bff);color:#fff;border:0;border-radius:12px;padding:0 22px;font-weight:700;cursor:pointer}.muted{color:var(--m);font-size:12px}
.sum{padding:6px 14px;font-size:13px;font-weight:600;border-bottom:1px solid var(--b)}.sum.AVOID{color:#ff4d6a;background:#ff4d6a12}.sum.RISKY{color:#ffbb33;background:#ffbb3310}.sum.PASS{color:#2fe0a5;background:#2fe0a50d}
.card{background:linear-gradient(180deg,var(--p),#0c1017);border:1px solid var(--b);border-radius:16px;margin-top:14px;overflow:hidden;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.hd{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--b)}
.hd img{width:52px;height:52px;border-radius:12px;background:#222;object-fit:cover}.nm{font-size:18px;font-weight:800}.nm small{color:var(--m);font-weight:500;font-size:13px;margin-left:6px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:#1d2433;color:var(--m);margin-right:4px}
.ver{margin-left:auto;text-align:right}.pill{display:inline-block;padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px}
.PASS{background:#0f3b2d;color:var(--g);box-shadow:0 0 18px #2fe0a533}.RISKY{background:#3b2e0f;color:var(--y);box-shadow:0 0 18px #ffbb3322}.AVOID{background:#3b0f19;color:var(--r);box-shadow:0 0 18px #ff4d6a33}
.body{display:grid;grid-template-columns:150px 1fr 260px;gap:14px;padding:14px 16px}
.gauge{display:flex;flex-direction:column;align-items:center;justify-content:center}.gauge svg{width:120px;height:120px}.gauge b{font-size:12px;letter-spacing:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.st{background:var(--p2);border:1px solid var(--b);border-radius:10px;padding:8px 10px}.st span{display:block;color:var(--m);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}.st b{font-size:14px}
.st.bad{border-color:#5a1f2b}.st.bad b{color:var(--r)}.st.good b{color:var(--g)}.st.warn b{color:var(--y)}
.side h4{margin:0 0 6px;font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.5px}
.risk{display:block;margin:0 0 6px;padding:6px 9px;border-radius:8px;background:repeating-linear-gradient(45deg,#3a2a0a,#3a2a0a 6px,#33250a 6px,#33250a 12px);border:1px solid #6b4d12;color:var(--y);font-weight:600;font-size:12px;cursor:help}
.risk.hard{background:repeating-linear-gradient(45deg,#3a0a14,#3a0a14 6px,#330911 6px,#330911 12px);border-color:#7a1f30;color:var(--r)}
.clean{color:var(--g);font-weight:700}
.chg{display:flex;gap:6px;margin-top:8px}.chg>div{flex:1;text-align:center;background:var(--p2);border:1px solid var(--b);border-radius:8px;padding:5px}.chg>div>span{display:block;color:var(--m);font-size:10px}
.bsbar{height:8px;border:0;padding:0;border-radius:4px;background:var(--r);overflow:hidden;margin-top:4px}.bsbar i{display:block;height:100%;background:var(--g)}
.ft{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--b);background:#0b0e14;flex-wrap:wrap}
.ft a{color:#a9b4ff;text-decoration:none;padding:5px 10px;border:1px solid var(--b);border-radius:8px;font-size:12px}.ft a:hover{border-color:var(--a)}
.pt{margin-left:auto;background:linear-gradient(135deg,#2fe0a5,#16b585);color:#032;border:0;border-radius:10px;padding:8px 16px;font-weight:800;cursor:pointer}
.up{color:var(--g)}.dn{color:var(--r)}
#tip{position:fixed;z-index:9;max-width:330px;background:#141a26;border:1px solid var(--y);border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.45;display:none;box-shadow:0 10px 30px #000c}#tip b{color:var(--y)}
.q{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;background:#232a38;color:#9aa3b5;font-size:10px;cursor:help;margin-left:4px}
.load{padding:30px;text-align:center;color:var(--m)}
@media(max-width:1000px){.body{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}.glab{font-size:10px;letter-spacing:1px;color:var(--m);font-weight:700;margin-right:2px}.glab.gr{margin-left:auto}.sb{background:#1d2433;padding:7px 12px}.sb.my{background:#232a38}.sb:hover{filter:brightness(1.3)}
.ver{display:flex;flex-direction:column;gap:6px;align-items:flex-end}.vbig{font-size:18px!important;padding:8px 16px!important;letter-spacing:.5px}
.kp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px}.kp>div{background:var(--p2);border:1px solid var(--b);border-radius:10px;padding:6px 12px;min-width:92px}.kp>div span{display:block;color:var(--m);font-size:10px;text-transform:uppercase;letter-spacing:.5px}.kp>div b{font-size:16px}.kp .pt{margin-left:auto}
details.dt>summary{cursor:pointer;padding:8px 16px;color:#8ab4ff;font-size:12px;list-style:none;border-top:1px solid var(--b)}details.dt>summary::-webkit-details-marker{display:none}details.dt[open]>summary{color:var(--m)}
@media(max-width:700px){body{padding:10px}.hd{flex-wrap:wrap;gap:10px;padding:12px}.hd img{width:40px;height:40px}.ver{margin-left:0;width:100%;flex-direction:row;flex-wrap:wrap;align-items:center}.kp{padding:8px 12px}.kp>div{flex:1 1 40%;min-width:0}.kp .pt{width:100%;margin:0}.body{grid-template-columns:1fr!important;padding:10px 12px}.grid{grid-template-columns:repeat(2,1fr)!important}.chg{flex-wrap:wrap}.ft{flex-wrap:wrap}.grp .glab.gr{margin-left:0;width:100%}.top{flex-wrap:wrap}#live table{display:block;overflow-x:auto}.card{overflow:hidden}.tag{word-break:break-all}#vbar{right:10px}#qkRow{display:flex!important;flex-wrap:wrap;margin:6px 0 0!important;width:100%}#qk{flex:1;width:auto!important;min-width:0}}
@media(max-width:700px){#vbar>div,#vbar>span{padding:3px 6px!important;font-size:10px!important;box-shadow:none!important}#vbar button{padding:1px 5px!important}}
</style></head><body>
<div class="top"><span class="logo">⚡ QUICK SCAN</span><span class="muted">paste up to 100 Solana CAs · auto-scans on paste · Ctrl+Enter · hover a risk to learn it</span><span class="muted" id="t" style="margin-left:auto"></span></div>
<div class="bar"><textarea id="in" placeholder="Paste contract addresses…"></textarea><button class="btn" id="go" title="Check the coins pasted in the box">Scan</button></div>
<div class="grp"><span class="glab">FIND COINS</span><button class="btn pf sb" data-q="sort=created_timestamp&order=DESC&includeNsfw=false" title="Coins launched in the last minutes — live from pump.fun, plus new coins on other exchanges">🆕 Brand New</button><button class="btn pf sb" data-q="sort=market_cap&order=DESC&complete=false&includeNsfw=false" title="pump.fun coins 50%+ of the way to graduating (bonding curve % read live from the chain)">🏁 About to Graduate</button><button class="btn pf sb" data-q="sort=last_trade_timestamp&order=DESC&complete=true&includeNsfw=false" title="Coins that just finished the pump.fun curve and moved to a real exchange (live)">🎓 Just Graduated</button><button class="btn sb" id="tr" title="What everyone is trading right now — DexScreener + GeckoTerminal trending, no duplicates">🔥 Trending</button><button class="btn sb" id="cto" title="Coins the community took over after the dev left (DexScreener takeovers)">🤝 Takeovers</button>
<span class="glab gr">MY STUFF</span><button class="btn sb my" id="hx" title="Download every coin you have scanned (with 1h/6h/24h results)">📜 History</button><button class="btn sb my" id="acc" title="How often each verdict and check was right, checked 1h, 6h and 24h after the scan">📊 Accuracy</button></div>
<div style="margin-top:8px" class="muted"><label title="Source buttons skip coins already in your History, so a refresh shows NEW coins"><input type="checkbox" id="hideSeen"> hide coins I already scanned</label> <span id="lpSt" style="margin-left:12px"></span>
 <span id="qkRow" style="margin-left:12px;display:inline-flex;gap:4px;align-items:center" title="Give Quick Scan its own free Helius key so big scans don't rate-limit your Paper Trade windows. Empty = uses the Paper Trade key.">Quick Scan Helius key: <input id="qk" placeholder="empty = use Paper Trade key" style="width:250px;padding:3px 6px;background:#0e1118;color:#fff;border:1px solid #333;border-radius:6px;filter:blur(5px)"><button id="qkEye" style="background:#0e1118;color:#fff;border:1px solid #333;border-radius:6px;cursor:pointer">👁</button> <span id="qkSt"></span> <span id="helSt" class="muted"></span></span></div>
<div id="live" style="display:none"></div>
<div id="out"></div><div id="tip"></div>
<script>
const R={minLiq:20000,maxTop10:25,minLP:80,maxIns:3};
const $=s=>document.querySelector(s),f=(u,t=0)=>fetch(u).then(r=>r.ok?r.json():(r.status===429&&t<2?new Promise(z=>setTimeout(z,2500*(t+1))).then(()=>f(u,t+1)):null)).catch(()=>t<1?new Promise(z=>setTimeout(z,2500)).then(()=>f(u,t+1)):null);
const k=n=>n==null||isNaN(n)?'-':Math.abs(n)>=1e9?(n/1e9).toFixed(2)+'B':Math.abs(n)>=1e6?(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e3?(n/1e3).toFixed(1)+'K':(+n).toFixed(0);
const age=ms=>{const h=(Date.now()-ms)/36e5;return h<1?Math.round(h*60)+'m':h<48?Math.round(h)+'h':Math.round(h/24)+'d'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L={
 'No market':'There is no trading pool, so you can\'t sell. Usually a dead or fake CA. Verify the contract from the coin\'s own X/site.',
 'No real liquidity':'Almost no money in the pool compared to the market cap, so the price is not real and you could not sell.','Low liquidity':'Thin pool = small sells crash the price and you may not get out. Liquidity should be 5-10%+ of market cap.',
 'Already rugged':'RugCheck saw the liquidity pulled or a mass dump. It\'s over — don\'t buy the "dip".',
 'Mint authority ON':'The dev can create new tokens anytime and sell them into your buys, crashing price to zero. Safe coins have it revoked.',
 'Freeze authority ON':'The dev can freeze your wallet so you can buy but never sell (a honeypot). Safe coins have it revoked.',
 'LP not locked':'Liquidity isn\'t locked/burned, so the dev can pull the pool and leave you holding a worthless coin. Look for 80-100%.',
 'Top 10 hold too much':'A few wallets own a big chunk of supply. If they sell together, price dumps hard. Aim for top 10 under ~25%.',
 'Copycat / vamp':'An older, still-active coin uses the same ticker or name. Copycats ("vamps") catch people who search the ticker instead of copying the real CA.','Insider networks':'Groups of linked wallets funded from the same source — often one team posing as many buyers (a bundled launch). They dump on later buyers. Confirm on Bubblemaps: starburst clusters = bad.',
 'Transfer tax':'Every buy/sell pays a % fee to a wallet the dev controls. It eats your profit and the dev can raise it.',
 'Mutable metadata':'The dev can still change the coin\'s name/image/links. Often used to rebrand into a scam or impersonate another coin.',
 'Dev still holding':'The creator still has a bag and can dump it on you. Lower is safer.',
 'Single big holder':'One wallet owns a huge % of supply. One click from them can crash the chart.'};
const MUT=rc=>!!(rc&&rc.tokenMeta&&(rc.tokenMeta.mutable||(rc.tokenMeta.updateAuthority&&!/^1{20,}/.test(rc.tokenMeta.updateAuthority))));
// Removed after testing (2026-10-30, see Change Log): fees box, staircase/one-wallet, fresh-wallets warning, holders-dumped warning, honeypot flag.
// Pool/AMM wallets are not holders: skip them in top-10 / wallet map (matches Axiom).
function poolTest(rc){const ka=rc.knownAccounts||{},pool=new Set();(rc.markets||[]).forEach(x=>[x.liquidityA,x.liquidityB,x.pubkey,x.liquidityAAccount,x.liquidityBAccount].forEach(a=>a&&pool.add(a)));return h=>pool.has(h.address)||pool.has(h.owner)||/AMM/i.test(((ka[h.owner]||ka[h.address]||{}).type)||'')}
const SUMD={};
function summary(d){const r=[...new Set(d.reasons)],two=r.slice(0,2).join(' and ');
 if(d.v==='AVOID')return 'Danger: '+two+' — likely fake or a rug. Don\'t trade it.';
 const t=d.en==='LATE'?' It already pumped hard — don\'t chase.':d.en==='FALLING'?' Price is falling right now — wait.':'';
 if(d.v==='RISKY')return 'Caution: '+two+'.'+t+(t?'':' Small size only, check Bubblemaps first.');
 return 'Looks clean on paper: no red flags from RugCheck, DexScreener or the wallet check.'+(t||' Still check Bubblemaps before buying.')+(d.info?' Note: '+d.info+'.':'')}
const PAIR={},HOLD={},HIST='qs_history',BTNOF={};
const EXP={'Liquidity':'Money in the trading pool. Low = you may not be able to sell without crashing the price.','Liq / MC':'Liquidity as % of market cap. Under ~5% is thin; healthy coins are often 8%+.','Volume 24h':'Total traded in 24h. Can be faked by bots — compare with fees and holders.','Holders':'Wallets holding the coin. Way too many holders for a small market cap = fake wallets.','Top 10':'% of supply held by the 10 biggest wallets. Under 25% is safer.','LP Locked':'% of liquidity locked/burned so the dev can\'t pull it. Want 80-100%.','Insider nets':'Groups of linked wallets (same funder). High = bundled launch, they dump on you.','Dev holds':'% the creator still holds. Over 5% = dump risk.','Mint auth':'If ON, dev can print new tokens. Want Revoked.','Freeze auth':'If ON, dev can freeze your wallet so you can\'t sell. Want Revoked.','Tax':'Fee on every buy/sell going to the dev. Want 0%.','Metadata':'If Mutable, dev can change name/image/links later.','Avg trade':'Volume ÷ number of trades. Tons of tiny trades = bots faking volume.','Holders / $1K MC':'Real coins rarely have more than ~50 holders per $1K of market cap. Way more = farmed fake wallets.'};
const risk=(name,hard,extra)=>`<span class="risk ${hard?'hard':''}" data-t="${esc(name)}" data-x="${esc(extra||L[name]||'Flag from RugCheck. Open RC for details.')}">${hard?'⛔':'⚠️'} ${esc(name)}</span>`;
function gauge(score,label,col){const pct=Math.max(4,Math.min(100,score)),c=2*Math.PI*48;
 return `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="none" stroke="#1d2433" stroke-width="10"/><circle cx="60" cy="60" r="48" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}" transform="rotate(-90 60 60)" style="filter:drop-shadow(0 0 6px ${col})"/><text x="60" y="68" text-anchor="middle" fill="${col}" font-size="28" font-weight="800">${score}</text></svg><b style="color:${col}">${label}</b>`}
async function one(m){
 const [ds0,ds1,rc]=await Promise.all([f('https://api.dexscreener.com/token-pairs/v1/solana/'+m),f('https://api.dexscreener.com/tokens/v1/solana/'+m),f('https://api.rugcheck.xyz/v1/tokens/'+m+'/report')]);
 const seenP=new Set(),ds=[...(ds0||[]),...(ds1||[])].filter(x=>x&&x.pairAddress&&!seenP.has(x.pairAddress)&&seenP.add(x.pairAddress));
 const p0=ds.sort((a,b)=>((b.liquidity||{}).usd||0)-((a.liquidity||{}).usd||0))[0];
 // main pair for price/age/socials, but liquidity, volume and trade counts summed across ALL pools (fixes WIF/BONK reading tiny)
 const p=p0?{...p0,info:p0.info||(ds.find(x=>x.info)||{}).info,liquidity:{usd:ds.reduce((t,x)=>t+((x.liquidity||{}).usd||0),0)},volume:{h24:ds.reduce((t,x)=>t+((x.volume||{}).h24||0),0)},txns:{h24:{buys:ds.reduce((t,x)=>t+(((x.txns||{}).h24||{}).buys||0),0),sells:ds.reduce((t,x)=>t+(((x.txns||{}).h24||{}).sells||0),0)}},pairCreatedAt:Math.min(...ds.map(x=>x.pairCreatedAt||Infinity))}:null;
 if(p&&!isFinite(p.pairCreatedAt))p.pairCreatedAt=p0.pairCreatedAt;
 const risks=[],names=[];let hard=0,soft=0;const add=(n,h,x)=>{risks.push(risk(n,h,x));names.push((h?'⛔ ':'⚠️ ')+n);h?hard++:soft++};
 const liq=p?(p.liquidity||{}).usd||0:0,mc=p?(p.marketCap||p.fdv||0):0;
 const AGE=p&&p.pairCreatedAt?(Date.now()-p.pairCreatedAt)/36e5:0,OLD=AGE>24*30;
 if(!p)add('No market',1);else if(mc>100000&&liq<Math.max(1000,mc*0.002))add('No real liquidity',1,'Pool holds only $'+k(liq)+' against a $'+k(mc)+' market cap ('+(mc?(liq/mc*100).toFixed(2):0)+'%). You cannot sell anything meaningful — the market cap is fake. Real coins (even BONK across many pools) are 0.4%+.');else if(liq<R.minLiq)add('Low liquidity',0);
 let top10=null,lp=null,ins=null,holders=null,tax=0,cb=null,single=0;
 if(rc){const isPool=poolTest(rc),realH=(rc.topHolders||[]).filter(h=>!isPool(h));// pool/AMM wallets skipped (matches Axiom: MEW 77%->66%)
  top10=realH.slice(0,10).reduce((s,h)=>s+(h.pct||0),0);single=Math.max(0,...realH.map(h=>h.pct||0));
  {const mk=(rc.markets||[]).map(x=>x.lp||{}),tot=mk.reduce((t,l)=>t+(l.quoteUSD||0)+(l.baseUSD||0),0),lk=mk.reduce((t,l)=>t+(l.lpLockedUSD||0),0);lp=tot>0?lk/tot*100:Math.max(0,...mk.map(l=>l.lpLockedPct||0))}// liquidity-weighted like RugCheck's page (Dacity 39%, not best-pool 100%)
  ins=rc.graphInsidersDetected||0;holders=rc.totalHolders;
  tax=((rc.transferFee||{}).pct)||0;cb=rc.creatorBalance!=null&&rc.token&&rc.token.supply?rc.creatorBalance/rc.token.supply*100:null;
  if(rc.rugged)add('Already rugged',1);if(rc.mintAuthority)add('Mint authority ON',1);if(rc.freezeAuthority)add('Freeze authority ON',1);
  if(lp<R.minLP&&!OLD)add('LP not locked',0,'Only '+lp.toFixed(0)+'% of liquidity is locked/burned. '+L['LP not locked']);
  if(top10>(OLD?60:R.maxTop10))add('Top 10 hold too much',!OLD&&top10>=90,'Top 10 wallets hold '+top10.toFixed(1)+'%. '+L['Top 10 hold too much']);
  if(single>20&&!OLD)add('Single big holder',0,'Largest wallet holds '+single.toFixed(1)+'%. '+L['Single big holder']);
  const insR=holders?ins/holders*100:0;if(ins>R.maxIns&&!(OLD||insR<0.5))add('Insider networks',insR>2&&ins>15,ins+' insider networks found. '+L['Insider networks']);
  if(tax>0)add('Transfer tax',tax>5,tax+'% tax. '+L['Transfer tax']);
  if(MUT(rc)&&!OLD)add('Mutable metadata',0);
  if(cb>5)add('Dev still holding',0,'Creator holds '+cb.toFixed(1)+'%. '+L['Dev still holding']);
  (rc.risks||[]).filter(x=>x.level==='danger'&&!/LP|Mint|Freeze|holder|Top 10|insider|liquidity/i.test(x.name)).forEach(x=>add(x.name,0,x.description));
 } else add('RugCheck unavailable',0,'Couldn\'t load RugCheck (rate limit or new coin). Open RC manually.');
// ---- vamp / copycat check: same ticker or name on another Solana coin ----
 let vampNote='';if(p){const norm=v=>(v||'').toLowerCase().replace(/[^a-z0-9]/g,''),sym=norm(p.baseToken.symbol),nm=norm(p.baseToken.name); // letters/numbers only: 'Pnut ' = 'PNUT' = '$pnut'
  const sr=await f('https://api.dexscreener.com/latest/dex/search?q='+encodeURIComponent(sym));const by={};
  for(const x of ((sr&&sr.pairs)||[])){if(x.chainId!=='solana'||!x.baseToken||x.baseToken.address===m)continue;if(norm(x.baseToken.symbol)!==sym&&norm(x.baseToken.name)!==nm)continue;
   const a=x.baseToken.address,o=by[a]||(by[a]={a,mc:0,liq:0,born:Infinity});o.mc=Math.max(o.mc,x.marketCap||x.fdv||0);o.liq+=((x.liquidity||{}).usd||0);o.born=Math.min(o.born,x.pairCreatedAt||Infinity)}
  const others=Object.values(by).filter(o=>o.liq>=1000),myBorn=p.pairCreatedAt||Date.now(),orig=others.filter(o=>o.born<myBorn-864e5&&o.mc>=Math.max(1e5,mc*0.1)).sort((a,b)=>b.mc-a.mc)[0]; // an OLDER coin with this ticker that is still substantial = the likely original (copies can fake a bigger MC, e.g. MICHI/PNUT copies)
  if(orig){const ageD=(Date.now()-orig.born)/864e5,classic=(Date.now()-myBorn)/36e5<72&&orig.mc>=mc*0.3;
   add('Copycat / vamp',classic,'An OLDER coin called $'+p.baseToken.symbol+' already exists: CA '+orig.a.slice(0,4)+'…'+orig.a.slice(-4)+', market cap $'+k(orig.mc)+', '+(ageD<2?Math.round(ageD*24)+'h':Math.round(ageD)+'d')+' old ('+others.length+' coin'+(others.length>1?'s':'')+' share this ticker). A "vamp" copies a popular coin\'s name to catch people who search the ticker. Make sure you have the CA from the original\'s own X/site.');vampNote='an older $'+p.baseToken.symbol+' already exists (CA '+orig.a.slice(0,4)+'…'+orig.a.slice(-4)+', $'+k(orig.mc)+') — this looks like a copy'}

}
function set(s,err){V.state=s;if(err!=null)V.err=err;draw()}
// ---- data builders (read straight from browser storage; both pages share it) ----
const J=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function tradesCsv(w){const SK=['mc','liq','top10','insiders','holders','rug','timing','tips','wallet','scanAgeMin','price_src','warnings'];
 return 'time,token,ca,side,sol,tokens,price_sol,price_usd,mc,pnl_sol,'+SK.map(k=>'snap_'+k).join(',')+'\n'+(w.hist||[]).map(h=>[new Date(h.t).toISOString(),h.sym,h.ca,h.side,h.sol,h.tok,h.px,h.pu,h.mc,h.pnl,...SK.map(k=>(h.snap||{})[k])].map(q).join(',')).join('\n')}
function scanCsv(h){const tags=J('qs_tags',{});const C=['time','ca','symbol','mcap','liq','holders','top10','insiders','rug','entry','flags','source','button','early','volwarn','check24_at','check24_result','check24_mc_change','check24_liq_change'];
 return C.join(',')+'\n'+h.map(x=>{const r=x.r24||{};return [new Date(x.t).toISOString(),x.ca,x.sym,x.mc,x.liq,x.holders,x.top10,x.ins,x.rug,x.entry,x.flags,tags[x.ca]||x.src||'',x.btn||'',x.early?'EARLY':'',x.volw?'VOL WARN':'',r.at?new Date(r.at).toISOString():'',r.res||'',r.mcx!=null?(r.mcx*100-100).toFixed(1)+'%':'',r.lqx!=null?(r.lqx*100-100).toFixed(1)+'%':''].map(q).join(',')}).join('\n')}
window.vaultScanCsv=scanCsv;
function snapshotAll(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!SKIP.test(k)&&/^(papertrade_|qs_|pt_)/.test(k))o[k]=localStorage.getItem(k)}return o}
function hasData(){return localStorage.getItem('papertrade_v1')!=null||localStorage.getItem('qs_history')!=null}
// ---- file helpers ----
async function logsDir(){const d=V.dir;return d.name==='Logs'?d:await d.getDirectoryHandle('Logs',{create:true})}
async function writeF(dir,name,text){const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(text);await w.close()}
async function readF(dir,name){try{const fh=await dir.getFileHandle(name);return await (await fh.getFile()).text()}catch(e){return null}}
// ---- save (debounced, one window at a time) ----
let tmr=0;
window.vaultSave=function(reason){if(!V.ready)return;clearTimeout(tmr);tmr=setTimeout(()=>save(reason),700)};
// ---- save helper (session 11): small program on this PC (Vault/Bots/save_helper.js, starts hidden with Windows) — no browser permission needed.
// Order: save helper → vault folder permission → browser copy only (red bar).
const HELP='http://127.0.0.1:4848';V.helper=false;
async function helperPing(){try{const c=new AbortController();const tm=setTimeout(()=>c.abort(),1200);const r=await fetch(HELP+'/ping',{signal:c.signal});clearTimeout(tm);V.helper=r.ok&&(await r.json()).ok===true}catch(e){V.helper=false}return V.helper}
function buildFiles(){const w=J('papertrade_v1',null),h=J('qs_history',[]),full=JSON.stringify({app:'MemeCoinVault',v:1,saved:new Date().toISOString(),ls:snapshotAll()}),F={};
 if(w){F['wallet.json']=JSON.stringify(w,null,1);F['paper_trades.csv']=tradesCsv(w)}F['scan_history.csv']=scanCsv(h);F['scan_history.json']=full;
 if(window.accuracyReport){try{F['accuracy_report.md']=window.accuracyReport()}catch(e){}}F['backup/vault_'+new Date().toLocaleDateString('en-CA')+'.json']=full;return F}
async function helperSave(){const r=await fetch(HELP+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:buildFiles()})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||('save helper HTTP '+r.status))}
async function save(reason){
 if(V.helper||await helperPing()){try{await helperSave();V.lastOk=Date.now();V.saves++;V.lastReason=reason;V.via='save helper';set('ok','');return true}catch(e){V.helper=false;V.helperErr=e.message}}
 if(!V.dir){if(V.state!=='unsupported')set(V.state==='perm'?'perm':'off');return false}
 try{if((await V.dir.queryPermission({mode:'readwrite'}))!=='granted'){set('perm');return false}}catch(e){set('fail',e.message);return false}
 const run=async()=>{const L=await logsDir(),w=J('papertrade_v1',null),h=J('qs_history',[]);
  const full=JSON.stringify({app:'MemeCoinVault',v:1,saved:new Date().toISOString(),ls:snapshotAll()});
  if(w){await writeF(L,'wallet.json',JSON.stringify(w,null,1));await writeF(L,'paper_trades.csv',tradesCsv(w))}
  await writeF(L,'scan_history.csv',scanCsv(h));await writeF(L,'scan_history.json',full);
  if(window.accuracyReport){try{await writeF(L,'accuracy_report.md',window.accuracyReport())}catch(e){}}
  const B=await L.getDirectoryHandle('backup',{create:true}),day=new Date().toLocaleDateString('en-CA');await writeF(B,'vault_'+day+'.json',full)};
 try{if(navigator.locks)await navigator.locks.request('mcv_vault_save',run);else await run();V.lastOk=Date.now();V.saves++;V.lastReason=reason;V.via='folder';set('ok','');return true}
 catch(e){set('fail',(e&&e.message)||String(e));return false}}
// any write to watched keys in THIS window → save (other windows save their own writes)
const _set=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){_set.call(this,k,v);if(this===window.localStorage&&WATCH.test(k))window.vaultSave(k)};
// ---- restore: browser data empty but vault files exist ----
async function maybeRestore(){if(hasData()||!V.dir)return false;try{const L=await logsDir();let t=await readF(L,'scan_history.json'),o=null;
  if(t){try{o=JSON.parse(t).ls}catch(e){}}if(!o){const w=await readF(L,'wallet.json');if(w){try{JSON.parse(w);o={papertrade_v1:w}}catch(e){}}}
  if(!o||!Object.keys(o).length)return false;for(const k in o)if(!SKIP.test(k))_set.call(localStorage,k,o[k]);
  sessionStorage.setItem('mcv_restored',Object.keys(o).length);location.reload();return true}catch(e){set('fail','restore failed: '+e.message);return false}}
async function connect(){let step='open folder picker';try{
  let d;try{d=await window.showDirectoryPicker({id:'memecoinvault',mode:'readwrite',startIn:'documents'})}catch(e){if(e.name==='AbortError')throw new Error('folder picker was closed, or Chrome\'s "Let site edit files?" was not allowed — click Connect again and choose Allow / Edit files');throw e}
  step='get edit permission';let p='prompt';try{p=await d.queryPermission({mode:'readwrite'})}catch(e){}
  if(p!=='granted'){try{p=await d.requestPermission({mode:'readwrite'})}catch(e){throw new Error('Chrome refused edit permission ('+e.message+')')}}
  if(p!=='granted')throw new Error('Chrome did not allow saving in "'+d.name+'" (answer: '+p+') — click Connect again and choose Allow');
  step='remember folder';V.dir=d;V.pick=d.name;try{await iput('dir',d)}catch(e){V.remember='not remembered ('+e.message+') — you will need to click Connect after each restart'}
  step='restore check';if(await maybeRestore())return;V.ready=true;
  step='first save';const ok=await save('connect');if(ok&&!/meme coin vault|^logs$/i.test(d.name))vmsg('Saving into "'+d.name+'/Logs" — that is not the Meme Coin Vault folder. Click Pick folder again if that was a mistake.')
 }catch(e){V.ready=!!V.dir;set('fail',(e&&e.message||String(e))+' [step: '+step+']')}}
async function allow(){try{const p=await V.dir.requestPermission({mode:'readwrite'});if(p==='granted'){if(await maybeRestore())return;V.ready=true;await save('allow')}else set('perm')}catch(e){set('fail',e.message)}}
// ---- export / restore-from-file ----
function exportAll(){const t=JSON.stringify({app:'MemeCoinVault',v:1,saved:new Date().toISOString(),ls:snapshotAll()},null,1);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='meme_vault_backup_'+new Date().toLocaleDateString('en-CA')+'.json';a.click();vmsg('Exported everything ('+Math.round(t.length/1024)+' KB)')}
document.getElementById('vFile').onchange=async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;let o;try{o=JSON.parse(await f.text());if(o.app!=='MemeCoinVault'||!o.ls)throw 0}catch(e){alertBar('Not a Meme Coin Vault backup file — nothing changed.');return}
 const w=(()=>{try{return JSON.parse(o.ls.papertrade_v1||'null')}catch(e){return null}})(),h=(()=>{try{return JSON.parse(o.ls.qs_history||'[]')}catch(e){return []}})();
 if(window.confirm('Restore backup from '+(o.saved||'?')+'?\nWallet: '+(w?w.bal.toFixed(3)+' SOL, '+w.hist.length+' trades':'none')+'\nScan history: '+h.length+' coins\nThis REPLACES what is in this browser now.')){for(const k in o.ls)if(!SKIP.test(k))_set.call(localStorage,k,o.ls[k]);location.reload()}};
function vmsg(m){if(typeof toast==='function')return toast(m);const d=document.createElement('div');d.textContent=m;d.style.cssText='background:#0f2a22;color:#2fe0a5;padding:6px 10px;border-radius:8px;margin-top:4px';bar.appendChild(d);setTimeout(()=>d.remove(),5000)}
function alertBar(m){set(V.state);const d=document.createElement('div');d.textContent=m;d.style.cssText='background:#b3122e;color:#fff;padding:6px 10px;border-radius:8px;margin-top:4px';bar.appendChild(d);setTimeout(()=>d.remove(),5000)}
// ---- accuracy re-checks (session 10): run from EITHER page (Quick Scan or Paper Trade), one window at a time ----
// session 10: re-check points at 1h (r1), 6h (r6) and 24h (r24) after each scan — same free DexScreener batch call (30 coins per call)
const CHECKS=[['r1',36e5],['r6',216e5],['r24',864e5]];
async function recheckAll(){let n=0;for(const [key,ms] of CHECKS)n+=await recheckAt(key,ms);return n}
async function recheckAt(key,ms){let h;try{h=JSON.parse(localStorage.getItem('qs_history')||'[]')}catch(e){return 0}
 // a checkpoint is only taken in its own window (e.g. 1h check between 1h and 6h) so "1h later" really means ~1h
 const nextMs=(CHECKS[CHECKS.findIndex(c=>c[0]===key)+1]||[0,Infinity])[1];
 const due=h.filter(x=>!x[key]&&x.ca&&Date.now()-x.t>=ms&&(Date.now()-x.t<nextMs||key==='r24'));if(!due.length)return 0;
 const cas=[...new Set(due.map(x=>x.ca))].slice(0,300),cur={};
 for(let i=0;i<cas.length;i+=30){const r=await fetch('https://api.dexscreener.com/tokens/v1/solana/'+cas.slice(i,i+30).join(',')).then(r=>r.ok?r.json():null).catch(()=>null);if(r===null)return 0;
  for(const pr of r){const a=pr.baseToken&&pr.baseToken.address;if(!a)continue;const c=cur[a]||(cur[a]={mc:0,liq:0,n:0});c.mc=Math.max(c.mc,pr.marketCap||pr.fdv||0);c.liq+=(pr.liquidity||{}).usd||0;c.n++}
  await new Promise(z=>setTimeout(z,400))}
 let n=0;h=JSON.parse(localStorage.getItem('qs_history')||'[]');for(const x of h){if(x[key]||Date.now()-x.t<ms||!cas.includes(x.ca))continue;const c=cur[x.ca];
  const mcx=c&&x.mc?c.mc/x.mc:null,lqx=c&&x.liq?c.liq/x.liq:null;
  x[key]={at:Date.now(),mc:c?Math.round(c.mc):0,liq:c?Math.round(c.liq):0,mcx,lqx,res:!c||!c.n?'GONE':mcx!=null&&mcx<=0.2?'RUGGED':lqx!=null&&lqx<=0.2&&x.liq>1000?'LIQ PULLED':mcx!=null&&mcx>=2?'PUMPED':'ALIVE'};n++}
 if(n)localStorage.setItem('qs_history',JSON.stringify(h));return n}
window.mcvRecheck=async force=>{const last=+(localStorage.getItem('qs_recheck_at')||0);if(!force&&Date.now()-last<300000)return 0;_set.call(localStorage,'qs_recheck_at',String(Date.now()));let n=0;try{n=await recheckAll()}catch(e){}if(n)window.vaultSave&&window.vaultSave('recheck');return n};
setTimeout(()=>window.mcvRecheck(),8000);setInterval(()=>window.mcvRecheck(),600000);
// ---- start ----
(async()=>{if(await helperPing()){ // save helper running → no folder permission needed
  if(!hasData()){try{const j=await (await fetch(HELP+'/load')).json();const o=j.ok&&JSON.parse(j.text).ls;if(o&&Object.keys(o).length){for(const k in o)if(!SKIP.test(k))_set.call(localStorage,k,o[k]);sessionStorage.setItem('mcv_restored',Object.keys(o).length);location.reload();return}}catch(e){}}
  V.ready=true;const r0=sessionStorage.getItem('mcv_restored');if(r0){sessionStorage.removeItem('mcv_restored');vmsg('Restored '+r0+' saved items from your vault (save helper)')}
  try{const d0=await iget('dir');if(d0)V.dir=d0}catch(e){}await save('load');return}
 if(!window.showDirectoryPicker&&!window.__VAULT_TEST_DIR){V.state='unsupported';V.ready=true;draw();return}
 const d=window.__VAULT_TEST_DIR||await iget('dir');if(!d){set('off');V.ready=true;return}V.dir=d;
 let p='prompt';try{p=await d.queryPermission({mode:'readwrite'})}catch(e){}
 if(p!=='granted'){set('perm');return}
 if(await maybeRestore())return;V.ready=true;
 const r=sessionStorage.getItem('mcv_restored');if(r){sessionStorage.removeItem('mcv_restored');vmsg('Restored '+r+' saved items from your vault')}
 await save('load')})();
draw();
})();
