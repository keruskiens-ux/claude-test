<!doctype html>
<html><head><meta charset="utf-8"><title>Quick Scan</title>
<style>

.up{color:var(--g)}.dn{color:var(--r)}

@media(max-width:1000px){.body{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}

<div class="top"><span class="logo">⚡ QUICK SCAN</span><span class="muted">paste up to 100 Solana CAs · auto-scans on paste · Ctrl+Enter · hover a risk to learn it</span><span class="muted" id="t" style="margin-left:auto"></span></div>
<div style="margin:0 0 10px;padding:8px 12px;border:1px solid #7a1f30;border-radius:10px;background:#1f0a10;color:#ff8a9c;font-weight:700">🛑 Down 0.5 SOL today? STOP. Close the terminal. Tomorrow is another day.</div>
<div class="bar"><textarea id="in" placeholder="Paste contract addresses…"></textarea><button class="btn" id="go">Scan</button><button class="btn pf" data-q="sort=created_timestamp&order=DESC&includeNsfw=false" style="background:#1d2433">🆕 Pump New</button><button class="btn pf" data-q="sort=market_cap&order=DESC&complete=false&includeNsfw=false" style="background:#1d2433">🏁 Pump Final Stretch</button><button class="btn pf" data-q="sort=last_trade_timestamp&order=DESC&complete=true&includeNsfw=false" style="background:#1d2433">🚀 Pump Migrated</button><button class="btn gk" data-u="new_pools" style="background:#1d2433">🦎 Gecko New</button><button class="btn gk" data-u="trending_pools" style="background:#1d2433">🦎 Gecko Trending</button><button class="btn" id="hx" title="Download every coin you have scanned" style="background:#232a38">💾 History</button><button class="btn" id="cto" style="background:#1d2433">🤝 DEX CTO</button><button class="btn" id="tr" style="background:linear-gradient(135deg,#2fe0a5,#16b585);color:#032">🔥 DEX Trending</button></div>
<div id="out"></div><div id="tip"></div>
<script>
const R={minLiq:20000,maxTop10:25,minLP:80,maxIns:3};
const $=s=>document.querySelector(s),f=(u,t=0)=>fetch(u).then(r=>r.ok?r.json():(r.status===429&&t<2?new Promise(z=>setTimeout(z,2500*(t+1))).then(()=>f(u,t+1)):null)).catch(()=>t<1?new Promise(z=>setTimeout(z,2500)).then(()=>f(u,t+1)):null);
const k=n=>n==null||isNaN(n)?'-':Math.abs(n)>=1e9?(n/1e9).toFixed(2)+'B':Math.abs(n)>=1e6?(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e3?(n/1e3).toFixed(1)+'K':(+n).toFixed(0);
const age=ms=>{const h=(Date.now()-ms)/36e5;return h<1?Math.round(h*60)+'m':h<48?Math.round(h)+'h':Math.round(h/24)+'d'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L={
 'No market':'There is no trading pool, so you can\'t sell. Usually a dead or fake CA. Verify the contract from the coin\'s own X/site.',
 'No real liquidity':'Almost no money in the pool compared to the market cap, so the price is not real and you could not sell.','Low liquidity':'Thin pool = small sells crash the price and you may not get out. Liquidity should be 5-10%+ of market cap.',
 'Already rugged':'RugCheck saw the liquidity pulled or a mass dump. It\'s over — don\'t buy the "dip".',
 'Mint authority ON':'The dev can create new tokens anytime and sell them into your buys, crashing price to zero. Safe coins have it revoked.',
 'Freeze authority ON':'The dev can freeze your wallet so you can buy but never sell (a honeypot). Safe coins have it revoked.',
 'LP not locked':'Liquidity isn\'t locked/burned, so the dev can pull the pool and leave you holding a worthless coin. Look for 80-100%.',
 'Top 10 hold too much':'A few wallets own a big chunk of supply. If they sell together, price dumps hard. Aim for top 10 under ~25%.',
 'Insider networks':'Groups of linked wallets funded from the same source — often one team posing as many buyers (a bundled launch). They dump on later buyers. Confirm on Bubblemaps: starburst clusters = bad.',
 'Transfer tax':'Every buy/sell pays a % fee to a wallet the dev controls. It eats your profit and the dev can raise it.',
 'Mutable metadata':'The dev can still change the coin\'s name/image/links. Often used to rebrand into a scam or impersonate another coin.',
 'Dev still holding':'The creator still has a bag and can dump it on you. Lower is safer.',
 'Single big holder':'One wallet owns a huge % of supply. One click from them can crash the chart.'};
const MUT=rc=>!!(rc&&rc.tokenMeta&&(rc.tokenMeta.mutable||(rc.tokenMeta.updateAuthority&&!/^1{20,}/.test(rc.tokenMeta.updateAuthority))));
// Removed after testing (2026-10-30, see Change Log): fees box, staircase/one-wallet, fresh-wallets warning, holders-dumped warning, honeypot flag.
// Pool/AMM wallets are not holders: skip them in top-10 / wallet map (matches Axiom).
function poolTest(rc){const ka=rc.knownAccounts||{},pool=new Set();(rc.markets||[]).forEach(x=>[x.liquidityA,x.liquidityB,x.pubkey,x.liquidityAAccount,x.liquidityBAccount].forEach(a=>a&&pool.add(a)));return h=>pool.has(h.address)||pool.has(h.owner)||/AMM/i.test(((ka[h.owner]||ka[h.address]||{}).type)||'')}
const SUMD={};
function summary(d){const r=[...new Set(d.reasons)],two=r.slice(0,2).join(' and ');
 if(d.v==='AVOID')return 'Danger: '+two+' — likely fake or a rug. Don\'t trade it.';
 const t=d.en==='LATE'?' It already pumped hard — don\'t chase.':d.en==='FALLING'?' Price is falling right now — wait.':'';
 if(d.v==='RISKY')return 'Caution: '+two+'.'+t+(t?'':' Small size only, check Bubblemaps first.');
 return 'Looks clean on paper: no red flags from RugCheck, DexScreener or the wallet check.'+(t||' Still check Bubblemaps before buying.')}
const PAIR={},HOLD={},HIST='qs_history';
const EXP={'Liquidity':'Money in the trading pool. Low = you may not be able to sell without crashing the price.','Liq / MC':'Liquidity as % of market cap. Under ~5% is thin; healthy coins are often 8%+.','Volume 24h':'Total traded in 24h. Can be faked by bots — compare with fees and holders.','Holders':'Wallets holding the coin. Way too many holders for a small market cap = fake wallets.','Top 10':'% of supply held by the 10 biggest wallets. Under 25% is safer.','LP Locked':'% of liquidity locked/burned so the dev can\'t pull it. Want 80-100%.','Insider nets':'Groups of linked wallets (same funder). High = bundled launch, they dump on you.','Dev holds':'% the creator still holds. Over 5% = dump risk.','Mint auth':'If ON, dev can print new tokens. Want Revoked.','Freeze auth':'If ON, dev can freeze your wallet so you can\'t sell. Want Revoked.','Tax':'Fee on every buy/sell going to the dev. Want 0%.','Metadata':'If Mutable, dev can change name/image/links later.','Avg trade':'Volume ÷ number of trades. Tons of tiny trades = bots faking volume.','Holders / $1K MC':'Real coins rarely have more than ~50 holders per $1K of market cap. Way more = farmed fake wallets.'};
const risk=(name,hard,extra)=>`<span class="risk ${hard?'hard':''}" data-t="${esc(name)}" data-x="${esc(extra||L[name]||'Flag from RugCheck. Open RC for details.')}">${hard?'⛔':'⚠️'} ${esc(name)}</span>`;
function gauge(score,label,col){const pct=Math.max(4,Math.min(100,score)),c=2*Math.PI*48;
 return `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="none" stroke="#1d2433" stroke-width="10"/><circle cx="60" cy="60" r="48" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}" transform="rotate(-90 60 60)" style="filter:drop-shadow(0 0 6px ${col})"/><text x="60" y="68" text-anchor="middle" fill="${col}" font-size="28" font-weight="800">${score}</text></svg><b style="color:${col}">${label}</b>`}
async function one(m){
 const [ds0,ds1,rc]=await Promise.all([f('https://api.dexscreener.com/token-pairs/v1/solana/'+m),f('https://api.dexscreener.com/tokens/v1/solana/'+m),f('https://api.rugcheck.xyz/v1/tokens/'+m+'/report')]);
 const seenP=new Set(),ds=[...(ds0||[]),...(ds1||[])].filter(x=>x&&x.pairAddress&&!seenP.has(x.pairAddress)&&seenP.add(x.pairAddress));
 const p0=ds.sort((a,b)=>((b.liquidity||{}).usd||0)-((a.liquidity||{}).usd||0))[0];
 // main pair for price/age/socials, but liquidity, volume and trade counts summed across ALL pools (fixes WIF/BONK reading tiny)
 const p=p0?{...p0,info:p0.info||(ds.find(x=>x.info)||{}).info,liquidity:{usd:ds.reduce((t,x)=>t+((x.liquidity||{}).usd||0),0)},volume:{h24:ds.reduce((t,x)=>t+((x.volume||{}).h24||0),0)},txns:{h24:{buys:ds.reduce((t,x)=>t+(((x.txns||{}).h24||{}).buys||0),0),sells:ds.reduce((t,x)=>t+(((x.txns||{}).h24||{}).sells||0),0)}},pairCreatedAt:Math.min(...ds.map(x=>x.pairCreatedAt||Infinity))}:null;
 if(p&&!isFinite(p.pairCreatedAt))p.pairCreatedAt=p0.pairCreatedAt;
 const risks=[],names=[];let hard=0,soft=0;const add=(n,h,x)=>{risks.push(risk(n,h,x));names.push((h?'⛔ ':'⚠️ ')+n);h?hard++:soft++};
 const liq=p?(p.liquidity||{}).usd||0:0,mc=p?(p.marketCap||p.fdv||0):0;
 const AGE=p&&p.pairCreatedAt?(Date.now()-p.pairCreatedAt)/36e5:0,OLD=AGE>24*30;
 if(!p)add('No market',1);else if(mc>100000&&liq<Math.max(1000,mc*0.002))add('No real liquidity',1,'Pool holds only $'+k(liq)+' against a $'+k(mc)+' market cap ('+(mc?(liq/mc*100).toFixed(2):0)+'%). You cannot sell anything meaningful — the market cap is fake. Real coins (even BONK across many pools) are 0.4%+.');else if(liq<R.minLiq)add('Low liquidity',0);
 let top10=null,lp=null,ins=null,holders=null,tax=0,cb=null,single=0;
 if(rc){const isPool=poolTest(rc),realH=(rc.topHolders||[]).filter(h=>!isPool(h));// pool/AMM wallets skipped (matches Axiom: MEW 77%->66%)
  top10=realH.slice(0,10).reduce((s,h)=>s+(h.pct||0),0);single=Math.max(0,...realH.map(h=>h.pct||0));
  {const mk=(rc.markets||[]).map(x=>x.lp||{}),tot=mk.reduce((t,l)=>t+(l.quoteUSD||0)+(l.baseUSD||0),0),lk=mk.reduce((t,l)=>t+(l.lpLockedUSD||0),0);lp=tot>0?lk/tot*100:Math.max(0,...mk.map(l=>l.lpLockedPct||0))}// liquidity-weighted like RugCheck's page (Dacity 39%, not best-pool 100%)
  ins=rc.graphInsidersDetected||0;holders=rc.totalHolders;
  tax=((rc.transferFee||{}).pct)||0;cb=rc.creatorBalance!=null&&rc.token&&rc.token.supply?rc.creatorBalance/rc.token.supply*100:null;
  if(rc.rugged)add('Already rugged',1);if(rc.mintAuthority)add('Mint authority ON',1);if(rc.freezeAuthority)add('Freeze authority ON',1);
  if(lp<R.minLP&&!OLD)add('LP not locked',0,'Only '+lp.toFixed(0)+'% of liquidity is locked/burned. '+L['LP not locked']);
  if(top10>(OLD?60:R.maxTop10))add('Top 10 hold too much',!OLD&&top10>=90,'Top 10 wallets hold '+top10.toFixed(1)+'%. '+L['Top 10 hold too much']);
  if(single>20&&!OLD)add('Single big holder',0,'Largest wallet holds '+single.toFixed(1)+'%. '+L['Single big holder']);
  const insR=holders?ins/holders*100:0;if(ins>R.maxIns&&!(OLD||insR<0.5))add('Insider networks',insR>2&&ins>15,ins+' insider networks found. '+L['Insider networks']);
  if(tax>0)add('Transfer tax',tax>5,tax+'% tax. '+L['Transfer tax']);
  if(MUT(rc)&&!OLD)add('Mutable metadata',0);
  if(cb>5)add('Dev still holding',0,'Creator holds '+cb.toFixed(1)+'%. '+L['Dev still holding']);
  (rc.risks||[]).filter(x=>x.level==='danger'&&!/LP|Mint|Freeze|holder|Top 10|insider|liquidity/i.test(x.name)).forEach(x=>add(x.name,0,x.description));
 } else add('RugCheck unavailable',0,'Couldn\'t load RugCheck (rate limit or new coin). Open RC manually.');
const t24=(p&&p.txns&&p.txns.h24)||{},nTx=(t24.buys||0)+(t24.sells||0),vol=(p&&p.volume||{}).h24||0,avgTr=nTx?vol/nTx:0,hpk=holders&&mc?holders/(mc/1000):0;
 if(!OLD&&hpk>50)add('Fake wallets',1,holders+' holders on only $'+k(mc)+' market cap ('+hpk.toFixed(0)+' per $1K). Real coins don\'t get that many holders that cheap — wallets were farmed to look popular (like BITCAT).');
 if(!OLD&&AGE<24*7&&nTx>3000&&avgTr<35)add('Botted volume',0,'Average trade is only $'+avgTr.toFixed(0)+' across '+k(nTx)+' trades. Bots make tons of tiny buys to fake volume. Check if fees match the market cap.');

 const ageH=p&&p.pairCreatedAt?(Date.now()-p.pairCreatedAt)/36e5:99;if(ageH<2)add('Brand new (<2h)',0,'Only '+Math.round(ageH*60)+' minutes old. Most rugs happen in the first 1-2 hours. If it survives 2h+ with real holders, rug odds drop a lot.');
 if(p)PAIR[m]={rcH:holders,botted:names.some(n=>/Botted volume|Fake wallets/.test(n)),a:p.pairAddress,mc,nTx,vol,ageH,sol:(+p.priceNative&&+p.priceUsd)?(+p.priceUsd/+p.priceNative):0,q:(p.quoteToken||{}).symbol};
 if(rc&&rc.topHolders){const isPool=poolTest(rc);HOLD[m]=rc.topHolders.filter(h=>!isPool(h)).slice(0,15).filter(h=>h.owner).map(h=>({o:h.owner,p:h.pct||0}));}
 let en,ex;const _c=(p&&p.priceChange)||{},h1=+_c.h1||0,h6=+_c.h6||0,h24=+_c.h24||0,m5=+_c.m5||0;
 if(hard){en='DONT';ex='It failed the rug check. Timing doesn\'t matter — skip it.'}
 else if(h1>60||h6>200||h24>400){en='LATE';ex='Already pumped hard ('+(h1>60?'+'+h1+'% in 1h':h6>200?'+'+h6+'% in 6h':'+'+h24+'% in 24h')+'). Buying after a big run usually means buying the top — early buyers sell into you. Wait for a pullback (20-40% dip, then buyers return) or skip.'}
 else if(m5<-10||h1<-25){en='FALLING';ex='Price is dropping right now ('+(m5<-10?m5+'% in 5m':h1+'% in 1h')+'). Catching a falling coin is risky — wait until it stops dropping and buyers come back.'}
 else if(soft){en='CAUTION';ex='Timing looks okay, but the coin has risk flags. Only a small size, and check Bubblemaps first.'}
 else {en='GOOD';ex='Not a rug on paper, and it hasn\'t over-pumped or crashed recently. Still check Bubblemaps for clusters, then decide. Not financial advice.'}
 const EN={GOOD:['✅ OK TO TRADE','PASS'],CAUTION:['⚠️ SMALL SIZE ONLY','RISKY'],LATE:['⏳ LATE — DON\'T CHASE','RISKY'],FALLING:['📉 FALLING — WAIT','RISKY'],DONT:['⛔ DON\'T TRADE','AVOID']};
 const v=hard?'AVOID':soft?'RISKY':'PASS',col=v==='PASS'?'#2fe0a5':v==='RISKY'?'#ffbb33':'#ff4d6a';
 const safety=Math.max(0,100-hard*40-soft*12);
 const info=(p&&p.info)||{},img=info.imageUrl||'',socials=[...(info.websites||[]).map(w=>({u:w.url,l:'🌐 Site'})),...(info.socials||[]).map(s=>({u:s.url,l:s.type==='twitter'?'𝕏':s.type==='telegram'?'✈ TG':s.type}))];
 const q=p?(p.quoteToken||{}).symbol:'',stock=q&&!['SOL','WSOL','USDC','USDT','USD1'].includes(q.toUpperCase());
 const ch=(p&&p.priceChange)||{},tx=(p&&p.txns&&p.txns.h24)||{},bp=tx.buys+tx.sells?tx.buys/(tx.buys+tx.sells)*100:50;
 const cls=(bad,good)=>bad?'bad':good?'good':'';
 // plain-English summary (rule-based, no AI): biggest risk first
 const RW={'No market':'no trading pool exists','Already rugged':'RugCheck says it already rugged','Mint authority ON':'the dev can still mint new tokens','Freeze authority ON':'the dev can freeze your wallet','No real liquidity':'almost no liquidity ($'+k(liq)+') behind a $'+k(mc)+' market cap',
  'Top 10 hold too much':'the top 10 wallets hold '+(top10||0).toFixed(0)+'%','Fake wallets':'holders look farmed ('+Math.round(hpk)+' per $1K of market cap)','Insider networks':(ins||0)+' insider wallet networks','Transfer tax':tax+'% transfer tax','Botted volume':'volume looks botted (avg trade $'+avgTr.toFixed(0)+')',
  'Low liquidity':'liquidity is thin ($'+k(liq)+')','LP not locked':'only '+(lp||0).toFixed(0)+'% of liquidity is locked','Single big holder':'one wallet holds '+single.toFixed(0)+'%','Dev still holding':'the dev still holds '+(cb||0).toFixed(1)+'%','Mutable metadata':'the dev can still change the name/image','Brand new (<2h)':'it is under 2 hours old','Deep check incomplete':'the deep check could not finish (re-scan it)'};
 const reasons=[...names.filter(n=>n.startsWith('⛔')),...names.filter(n=>!n.startsWith('⛔'))].map(n=>n.replace(/^(⛔|⚠️) /,'')).map(n=>RW[n]||n.toLowerCase());
 SUMD[m]={v,en,reasons};const sumTxt=summary(SUMD[m]);
 try{localStorage.setItem('qs_card_'+m,JSON.stringify({t:Date.now(),rug:v==='PASS'?'NOT A RUG':v==='RISKY'?'RISKY':'RUG RISK',entry:EN[en][0].replace(/^\S+ /,''),flags:names.join(' | ')||'none',tips:'pending',wallet:'pending'}))}catch(e){}
